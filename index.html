<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-[#0E1015]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Infográfico: Compreendendo a Extensão Universitária</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans','Inter','system-ui','sans-serif'],
            serif: ['Newsreader','Georgia','serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:auto;background:#0E1015;-webkit-font-smoothing:antialiased}
    .canvas{min-width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8px}
    @media(min-width:768px){.canvas{height:100vh;overflow:hidden;padding:16px}}

    /* Zonas clicáveis - Novo efeito de sombreamento e luz (Glassmorphism) */
    .zone {
      position: absolute;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    
    .zone:hover {
      /* Remove o contorno e coloca um sombreamento suave escuro */
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
      
      /* O segredo: clareia sutilmente a parte da imagem que está embaixo da zona! */
      backdrop-filter: brightness(1.06) saturate(1.05);
      -webkit-backdrop-filter: brightness(1.06) saturate(1.05);
      
      /* Um fundo branco quase imperceptível só pra dar volume */
      background: rgba(255, 255, 255, 0.02);
    }

    /* Botão flutuante Tela Cheia */
    .fab-btn {
      background: rgba(18,21,27,.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.7);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab-btn:hover {
      color: #fff;
      transform: scale(1.05);
      background: rgba(30,35,45,.9);
    }

    /* Janela flutuante de citação */
    .cite-card{
      position:absolute;
      z-index:30;
      width:340px;
      background:#fff;
      border-radius:10px;
      box-shadow:0 8px 32px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.06);
      padding:20px;
      display:none;
      font-size:14px;
      color:#3a3a3a;
      line-height:1.55;
      animation:fadeIn .2s ease;
    }
    .cite-card.show{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .cite-card .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#999;margin-bottom:4px}
    .cite-card .title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:12px;line-height:1.3}
    .cite-card .src{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
    .cite-card .src.legal{color:#b45309}
    .cite-card .src.academic{color:#0369a1}
    
    .cite-card blockquote{
      font-family:'Newsreader',Georgia,serif;
      font-style:italic;
      font-size:15px; 
      color:#444;
      padding-left:12px;
      margin:0 0 14px 0;
    }
    .cite-card blockquote.bl{border-left:3px solid #d97706}
    .cite-card blockquote.bs{border-left:3px solid #0284c7}
    
    .cite-card .ref-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:4px;padding-top:10px;border-top:1px solid #eee}
    .cite-card .ref{font-family:ui-monospace,monospace;font-size:11px;color:#888;line-height:1.5}
    .cite-card .close-btn{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:16px;line-height:1;transition:all .15s}
    .cite-card .close-btn:hover{background:#f5f5f5;color:#666}
    .cite-card .copy-btn{font-size:11px;color:#aaa;cursor:pointer;border:none;background:none;padding:0;transition:color .15s}
    .cite-card .copy-btn:hover{color:#555}
  </style>
</head>
<body class="font-sans select-none relative">
  <main class="canvas">
    <div id="poster" class="relative inline-block shadow-2xl rounded-lg overflow-visible bg-[#F5F2EB] max-w-full">
      <img src="assets/infografico-final-v2.jpg" alt="Infográfico: Compreendendo a Extensão Universitária" class="block max-h-[97vh] max-w-[97vw] w-auto h-auto object-contain pointer-events-none select-none rounded-lg" loading="eager">

      <!-- Zonas clicáveis -->
      <div onclick="show('tripe',this)" class="zone" style="top:13.5%;left:1.8%;width:47.2%;height:35.5%"></div>
      <div onclick="show('dinamica',this)" class="zone" style="top:50.2%;left:1.8%;width:47.2%;height:38.5%"></div>
      <div onclick="show('protagonismo',this)" class="zone" style="top:3.2%;left:50.2%;width:25.2%;height:55.5%"></div>
      <div onclick="show('comparativo',this)" class="zone" style="top:3.2%;left:76.2%;width:22%;height:55.5%"></div>
      <div onclick="show('sintese',this)" class="zone" style="top:60%;left:50.2%;width:48%;height:28.5%"></div>
      <div onclick="show('rodape',this)" class="zone" style="top:90%;left:1.8%;width:96.4%;height:8.5%"></div>

      <!-- Janela flutuante de citação -->
      <div id="card" class="cite-card">
        <button class="close-btn" onclick="hide()">×</button>
        <div id="c-label" class="label"></div>
        <div id="c-title" class="title"></div>
        <div class="src legal" style="display:flex;justify-content:space-between;align-items:center">
          <span id="c-lt"></span>
          <button class="copy-btn" onclick="cp('c-lq')">copiar</button>
        </div>
        <blockquote id="c-lq" class="bl"></blockquote>
        <div class="src academic" style="display:flex;justify-content:space-between;align-items:center">
          <span id="c-at"></span>
          <button class="copy-btn" onclick="cp('c-aq')">copiar</button>
        </div>
        <blockquote id="c-aq" class="bs"></blockquote>
        <div class="ref-label" style="display:flex;justify-content:space-between;align-items:center">
          <span>Referências</span>
          <button class="copy-btn" onclick="cp('c-ref')">copiar</button>
        </div>
        <div id="c-ref" class="ref"></div>
      </div>
    </div>
  </main>

  <!-- Botões de Controle Flutuantes -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col gap-3">
    <button onclick="toggleFs()" class="fab-btn" title="Tela Cheia">
      <i data-lucide="maximize" id="fs-i" class="w-5 h-5"></i>
    </button>
  </div>

  <script>
    const db={
      tripe:{label:"Art. 207 · CF/88",title:"O Tripé Acadêmico",lt:"Constituição Federal, Art. 207:",lq:"As universidades gozam de autonomia didático-científica, administrativa e de gestão financeira e patrimonial, e obedecerão ao princípio de indissociabilidade entre ensino, pesquisa e extensão.",at:"Miguel, José Carlos (2023, P.7):",aq:"A indissociabilidade não é uma simples união mecânica das três funções, mas uma dinâmica na qual o ensino se nutre da pesquisa e ambas se conectam à sociedade por meio da extensão.",ref:"BRASIL. CF/1988, Art. 207; MIGUEL, J. C. Práxis Educativa, v. 19, e11534, p. 1-17, 2023."},
      dinamica:{label:"Art. 5º · Res. 7/2018",title:"Via de Mão Dupla",lt:"Resolução CNE/CES nº 7/2018, Art. 5º:",lq:"A Interação Dialógica orienta relações entre universidade e setores sociais marcadas pelo diálogo e troca de saberes, superando a hegemonia acadêmica.",at:"Fontenele, I. C. (2024, P.5):",aq:"A via de mão dupla constitui a ruptura epistemológica essencial: produzir novas sínteses a partir do confronto com realidades e saberes populares locais.",ref:"BRASIL. Res. CNE/CES nº 7/2018; FONTENELE, I. C. Rev. Katálysis, v. 27, e97067, 2024."},
      protagonismo:{label:"Art. 6º · Res. 7/2018",title:"Protagonismo Discente",lt:"Resolução CNE/CES nº 7/2018, Art. 6º:",lq:"As atividades extensionistas devem assegurar o protagonismo discente em sua formulação, execução e avaliação, estimulando a reflexão crítica.",at:"Ayas & Zeniuk (2001) / Schön:",aq:"A intervenção em problemas reais capacita o estudante como 'prático reflexivo', construindo conhecimento no ciclo de planejar, agir, avaliar e refletir.",ref:"BRASIL. Res. CNE/CES nº 7/2018, Art. 6º; AYAS, K.; ZENIUK, N. Management Learning, v. 32, n. 1, p. 61–76, 2001."},
      comparativo:{label:"Parecer 608/2018",title:"Extensão vs. Voluntariado vs. Assistencialismo",lt:"Parecer CNE/CES nº 608/2018:",lq:"A extensão não se confunde com voluntariado ou assistência social; exige intencionalidade pedagógica, articulação teórica e avaliação de impacto.",at:"Miguel, J. C. (2023, P.11-12):",aq:"Superar a herança assistencialista exige planejamento formativo que gere autonomia comunitária e transformação estrutural duradoura.",ref:"BRASIL. Parecer CNE/CES nº 608/2018; MIGUEL, J. C. Práxis Educativa, v. 19, e11534, 2023."},
      sintese:{label:"Função Social",title:"Por que atuar na sociedade?",lt:"Parecer CNE/CES nº 608/2018:",lq:"A universidade cumpre sua função social quando se insere nos desafios regionais, construindo soluções com as pessoas, e não apenas para elas.",at:"Oliveira, P. H. P. (2024, P.1-3):",aq:"Estudantes desenvolveram consultoria para microempreendedoras via PBL, conquistando o 3º lugar no Prêmio Sebrae 2024.",ref:"BRASIL. Parecer 608/2018; OLIVEIRA, P. H. P. Regae, v. 13, n. 22, e89137, 2024."},
      rodape:{label:"Fontes",title:"Referências Consultadas",lt:"Legislação oficial:",lq:"Resolução CNE/CES nº 7/2018; Parecer CNE/CES nº 608/2018.",at:"Produção científica:",aq:"Fontenele (2024); Miguel (2023); Oliveira (2024). Conferidas nas fontes originais.",ref:"Detalhes em desenvolvimento.md e todo.md."}
    };

    lucide.createIcons();

    const card=document.getElementById('card');
    const poster=document.getElementById('poster');

    /* Lógica do Fullscreen */
    function toggleFs(){
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
        document.getElementById('fs-i').setAttribute('data-lucide','minimize');
      }else{
        document.exitFullscreen();
        document.getElementById('fs-i').setAttribute('data-lucide','maximize');
      }
      lucide.createIcons();
    }
    document.addEventListener('fullscreenchange',()=>{
      document.getElementById('fs-i').setAttribute('data-lucide',document.fullscreenElement?'minimize':'maximize');
      lucide.createIcons();
    });

    /* Lógica do Card Flutuante */
    function show(k,el){
      const d=db[k];if(!d)return;
      document.getElementById('c-label').innerText=d.label;
      document.getElementById('c-title').innerText=d.title;
      document.getElementById('c-lt').innerText=d.lt;
      document.getElementById('c-lq').innerText=d.lq;
      document.getElementById('c-at').innerText=d.at;
      document.getElementById('c-aq').innerText=d.aq;
      document.getElementById('c-ref').innerText=d.ref;

      const zr=el.getBoundingClientRect();
      const pr=poster.getBoundingClientRect();
      let left=zr.right-pr.left+8;
      let top=zr.top-pr.top;

      if(left+card.offsetWidth>pr.width) left=zr.left-pr.left-card.offsetWidth-8;
      if(top+card.offsetHeight>pr.height) top=pr.height-card.offsetHeight-8;
      if(top<8) top=8;
      if(left<8) left=8;

      card.style.left=left+'px';
      card.style.top=top+'px';
      card.classList.add('show');
    }
    function hide(){card.classList.remove('show')}
    function cp(id){
      const t=document.getElementById(id).innerText;
      navigator.clipboard.writeText(t).then(()=>{
        const el=document.getElementById(id);
        el.style.background='#f0fdf4';
        setTimeout(()=>el.style.background='',1000);
      });
    }

    document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
    document.addEventListener('click',e=>{
      // Se clicou fora do card E não foi numa zona clicável
      if(!card.contains(e.target) && !e.target.classList.contains('zone')) {
        hide();
      }
    });
  </script>
</body>
</html>
